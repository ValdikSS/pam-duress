name: Build .deb packages

on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build_ubuntu:
    name: Build .deb on ${{ matrix.os }}

    strategy:
      matrix:
        #os: [ubuntu-24.04, ubuntu-26.04]
        os: [ubuntu:22.04, ubuntu:24.04, ubuntu:26.04, debian:12, debian:13]

    #runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Install compilation essentials
        run: |
          apt update
          DEBIAN_FRONTEND=noninteractive apt install -y build-essential devscripts git
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@v7

      - name: Declare short commit variable and OS without colon
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "os_clean=$(echo ${{ matrix.os }} | tr : -)" >> $GITHUB_OUTPUT

      #- name: Do OS stuff
      #  run: |
      #    sudo rm -f /var/lib/man-db/auto-update
      #    sudo mv /usr/local /usr/local_

      - name: Compile for x86_64
        run: |
          apt build-dep -y .
          dpkg-buildpackage -nc
          cp ../*.deb .

      - name: Upload output file x86_64
        uses: actions/upload-artifact@v7
        with:
          name: libpam-duress-${{ steps.vars.outputs.os_clean }}-${{ steps.vars.outputs.sha_short }}
          path: "*.deb"
